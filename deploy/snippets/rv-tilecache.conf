# 瓦片缓存公共片段。放到 /etc/nginx/snippets/rv-tilecache.conf，
# 被 deploy/nginx.conf 里各个 /tiles/* 位置块 include。
#
# 要点：
#   - proxy_cache_valid 按源站缓存头走，兜底 7 天（OSM 政策的最低要求就是 7 天）
#   - 源站挂了用旧缓存顶上（proxy_cache_use_stale），地图不至于整片空白
#   - 不对客户端暴露 X-Cache，避免被当成缓存探测接口；调试时临时打开即可

proxy_cache             rvtiles;
proxy_cache_valid       200 7d;
proxy_cache_valid       404 10m;
proxy_cache_use_stale   error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock        on;              # 同一张瓦片只回源一次
proxy_cache_revalidate  on;
proxy_ignore_headers    Cache-Control Expires Set-Cookie;

proxy_http_version      1.1;
proxy_set_header        Connection "";
proxy_ssl_server_name   on;
proxy_connect_timeout   5s;
proxy_read_timeout      20s;

add_header X-Content-Type-Options nosniff always;
# add_header X-Cache $upstream_cache_status;   # 调试时打开
