# 反向代理配置。放在 /etc/nginx/conf.d/rvcamp.conf
#
# 三件事必须做对，否则上线会出问题：
#   1. client_max_body_size —— 默认 1MB，用户传手机照片会直接 413
#   2. X-Forwarded-For —— 不给的话后端看到的 IP 全是 127.0.0.1，
#      限流和登录锁定会对所有人一视同仁（等于失效）
#   3. uploads 加缓存头 —— 图片不会变，别让用户每次都重新下载

upstream rvcamp {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 可选的第二层缓存。平时不需要：瓦片缓存在后端 Python 里已经落盘了
# （data/tiles/，详见 backend/tileproxy.py），nginx 再加一层属于锦上添花。
# 只有在并发很高、想让静态瓦片完全不惊动 Python 进程时才启用：
#   1. 取消下面 proxy_cache_path 与 location /tiles/ 里 include 行的注释
#   2. 记得 mkdir -p /var/cache/nginx/rvtiles
# proxy_cache_path /var/cache/nginx/rvtiles levels=1:2 keys_zone=rvtiles:64m
#                  max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 单张图上限 5MB，一次最多 8 张，留足余量
    client_max_body_size 48m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- 自建瓦片代理
    # 底图全部走自家域名：/tiles/{上游}/{路径} -> 后端 tileproxy.py。
    # 后端负责磁盘缓存、单飞回源、防盗链和样式 JSON 的 URL 改写，
    # 这一层只管转发。上游默认 OpenFreeMap（免费、无 Key、允许商用）；
    # 想彻底离线就把它指向自己生成的 mbtiles 服务（见 deploy/selfhost-tiles/），
    # 那时这里连一个字节都不用改。
    location /tiles/ {
        proxy_pass http://rvcamp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        # 高并发时可选：打开下面这行启用 nginx 层二级缓存（需先放开上面的缓存区定义）
        # include snippets/rv-tilecache.conf;
    }

    # 上传的营地照片：内容不可变，长缓存
    location /uploads/ {
        proxy_pass http://rvcamp;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后台入口：建议再加一层 basic auth 或 IP 限制，双保险
    location /rv-backstage-7f3a {
        proxy_pass http://rvcamp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://rvcamp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 关键：没有这三行，后端拿不到真实 IP，限流形同虚设
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
