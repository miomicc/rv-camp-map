<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>营地地图 · 管理后台</title>
<style>
:root{
  --green:#2E6B4F; --green-d:#1F4A36; --green-l:#E8F1EC;
  --orange:#D97A3D; --orange-l:#FBEFE6;
  --blue:#3B7DD8; --purple:#8B5CF6; --gold:#C9A227;
  --red:#C0392B; --red-l:#FBEBEB;
  --ink:#1F2421; --ink-2:#5A625D; --ink-3:#8A918C;
  --bg:#F2F1ED; --card:#FFF; --side:#22292A; --side-2:#2C3435;
  --line:#E3E1DC; --line-2:#D2CFC8;
  --shadow:0 1px 3px rgba(31,36,33,.07); --shadow-lg:0 8px 30px rgba(31,36,33,.14);
  --r:9px; --r-lg:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* ---------------- 登录页 ---------------- */
#loginPage{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,#1E3A2E,#2E6B4F 55%,#3A7A5C);padding:20px}
.login-card{width:100%;max-width:376px;background:#fff;border-radius:16px;padding:34px 30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.login-logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(145deg,var(--green),#3E8A66);display:grid;place-items:center;margin:0 auto 18px}
.login-logo svg{width:26px;height:26px}
.login-card h1{font-size:19px;font-weight:600;text-align:center;margin-bottom:6px}
.login-card .sub{font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:24px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.fld input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);outline:none;transition:.15s}
.fld input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,107,79,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r);font-size:14px;font-weight:500;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-d)}
.btn-ghost{background:#fff;border:1px solid var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green);color:var(--green-d)}
.btn-danger{background:#fff;border:1px solid #E8B4AE;color:var(--red)}
.btn-danger:hover{background:var(--red-l)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.btn-lg{width:100%;height:44px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alert{padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
.alert-err{background:var(--red-l);color:var(--red)}
.alert-info{background:var(--green-l);color:var(--green-d)}
.login-hint{margin-top:20px;padding:11px;background:#F7F6F3;border-radius:9px;font-size:12px;color:var(--ink-2);line-height:1.7;text-align:center}

/* ---------------- 布局 ---------------- */
#app{display:flex;min-height:100vh}
.side{width:216px;background:var(--side);color:#B8C0BC;flex:0 0 auto;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{padding:20px 18px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#3E8A66,#2E6B4F);display:grid;place-items:center;flex:0 0 auto}
.side-brand b{color:#fff;font-size:14px;font-weight:600;display:block;line-height:1.2}
.side-brand small{font-size:10.5px;color:#7C8783;display:block;margin-top:2px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-t{font-size:10.5px;color:#6B7570;letter-spacing:.8px;padding:12px 10px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;cursor:pointer;transition:.13s;margin-bottom:2px;color:#B8C0BC}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--green);color:#fff;font-weight:500}
.nav-i svg{width:16px;height:16px;flex:0 0 auto}
.nav-badge{margin-left:auto;background:var(--orange);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-i.on .nav-badge{background:rgba(255,255,255,.28)}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#6B7570}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.top h2{font-size:16.5px;font-weight:600;flex:1}
.who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.content{padding:22px 24px 40px;flex:1}

/* ---------------- 卡片与统计 ---------------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.card .v{font-size:25px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.card .d{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.card.hl .v{color:var(--green-d)}
.card.warn .v{color:var(--orange)}
.card.money .v{color:var(--gold)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:14.5px;font-weight:600;flex:1;min-width:120px}
.panel-b{padding:16px 18px}
.panel-b.flush{padding:0}

/* ---------------- 筛选条 ---------------- */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.inp{height:36px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r);outline:none;background:#fff;transition:.15s;font-size:13.5px}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,107,79,.1)}
.chips{display:flex;gap:6px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:3px}
.chip{height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:5px;transition:.13s}
.chip:hover{color:var(--green-d)}
.chip.on{background:var(--green);color:#fff;font-weight:500}
.chip .n{font-size:11.5px;opacity:.75}

/* ---------------- 表格 ---------------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 14px;font-size:12px;font-weight:600;color:var(--ink-3);background:#FAF9F7;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:#FAFBF9}
tbody tr:last-child td{border-bottom:none}
.tname{font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tsub{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.thumb-sm{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:#F2F1ED}
.thumb-none{width:46px;height:46px;border-radius:8px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--ink-3);font-size:10.5px}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
.t-green{background:var(--green-l);color:var(--green-d)}
.t-orange{background:var(--orange-l);color:#8A4A14}
.t-gray{background:#F1EFE8;color:var(--ink-2)}
.t-red{background:var(--red-l);color:var(--red)}
.t-blue{background:#E6F1FB;color:#1B5E9E}
.t-gold{background:#FAF1D6;color:#7A5E0E}
.acts{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
.pager{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pager .sp{flex:1}
.empty{text-align:center;padding:52px 20px;color:var(--ink-3);font-size:13.5px;line-height:1.7}
.empty svg{width:38px;height:38px;color:var(--line-2);margin-bottom:12px}

/* ---------------- 模态 ---------------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(31,36,33,.45)}
.modal.open{display:flex}
.modal-card{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:15px;box-shadow:var(--shadow-lg)}
.modal-card.wide{max-width:840px}
.modal-h{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.modal-h h3{font-size:16px;font-weight:600;flex:1}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:18px}
.x:hover{background:#F2F1ED;color:var(--ink)}
.modal-b{padding:20px 22px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.review-img{width:100%;max-height:220px;object-fit:contain;background:#F2F1ED;border-radius:9px;border:1px solid var(--line);margin-bottom:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(15,18,17,.9);padding:36px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .x{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:300;padding:11px 20px;border-radius:10px;background:rgba(31,36,33,.95);color:#fff;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:#256B4C}
.toast.err{background:#A5352A}
.kv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv-k{flex:0 0 84px;color:var(--ink-3);font-size:12.5px}
.kv-v{flex:1;word-break:break-all;line-height:1.6}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.sec{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.6px;margin:20px 0 10px}
.logs{max-height:calc(100vh - 240px);overflow-y:auto}
.log{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.log:last-child{border-bottom:none}
.log .t{flex:0 0 128px;color:var(--ink-3);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.log .c{flex:1;line-height:1.55}
.log b{font-weight:500}
@media(max-width:820px){
  .side{width:60px}
  .side-brand b,.side-brand small,.nav-i span,.nav-t,.nav-badge,.side-foot{display:none}
  .nav-i{justify-content:center;padding:11px 0}
  .top{padding:0 14px}
  .content{padding:16px 14px 30px}
  .grid2{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20V9l9-6 9 6v11"/><path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <h1>营地地图 · 管理后台</h1>
    <div class="sub">请输入管理员密钥</div>
    <div id="loginErr" class="alert alert-err hidden"></div>
    <div class="fld">
      <label>管理员密钥</label>
      <input id="lgKey" placeholder="请输入 ADM 开头的管理员密钥" autocomplete="off" spellcheck="false"
             style="font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.4px">
    </div>
    <button class="btn btn-primary btn-lg" id="lgBtn" onclick="doLogin()">登录</button>
    <div class="login-hint" id="adminHint">
      <div style="margin-top:8px;font-size:11.5px;color:#8A918C">
        普通用户密钥无法进入后台，权限由账号身份决定。<br>
        本地开发环境的演示密钥由 <code>seed.py</code> 随机生成，见启动日志或 data/dev_keys.json。
      </div>
    </div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="side-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V9l9-6 9 6v11"/><path d="M9 20v-6h6v6"/></svg>
      </div>
      <div><b>营地地图</b><small>管理后台</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>房车露营营地平台</div>
      <div style="margin-top:3px"><a href="/" target="_blank" style="color:#8FBF9F">查看用户端 →</a></div>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h2 id="pageTitle">数据概览</h2>
      <div class="who" id="who"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="lb" id="lb" onclick="closeLb()"><button class="x" onclick="closeLb()">×</button><img id="lbImg" alt="" onclick="event.stopPropagation()"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   营地地图 · 管理后台
   与用户端完全独立：单独的页面、单独的登录方式（账号密码）、单独的接口前缀
   ========================================================================= */

const API = (location.protocol === 'file:') ? 'http://127.0.0.1:8000' : location.origin;
const SKEY = 'rv_admin_token';
let TOKEN = localStorage.getItem(SKEY) || '';
let ME = null;
let SPOT_TYPES = [], FACILITY_KEYS = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yuan = fen => (fen / 100).toFixed(0);
const today = () => new Date().toISOString().slice(0, 10);

const STATUS = {
  0: {txt:'待审核', cls:'t-orange'},
  1: {txt:'已上线', cls:'t-green'},
  2: {txt:'已驳回', cls:'t-red'},
  3: {txt:'已下架', cls:'t-gray'},
};

function toast(msg, type = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast ' + type, 2600);
}

async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API + path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) {
    if (String(data.detail || '').includes('管理员')) { logout(); throw new Error('需要管理员权限'); }
    if (res.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
  }
  if (!res.ok) throw new Error(data.detail || ('请求失败 ' + res.status));
  return data;
}

function openModal(html) { $('#modalCard').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function openLb(src) { $('#lbImg').src = src; $('#lb').classList.add('open'); }
function closeLb() { $('#lb').classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLb(); closeModal(); }
});

/* ---------------- 登录 ---------------- */
async function doLogin() {
  const key = $('#lgKey').value.trim();
  const err = $('#loginErr');
  if (!key) { err.textContent = '请输入管理员密钥'; err.classList.remove('hidden'); return; }
  $('#lgBtn').disabled = true;
  $('#lgBtn').textContent = '登录中…';
  try {
    // 与用户端共用同一个密钥登录接口——权限由后端按 is_admin 判断
    const res = await fetch(API + '/api/auth/key/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({secret_key: key}),
    });
    const d = await res.json();
    if (!res.ok) {
      const msg = Array.isArray(d.detail) ? d.detail[0].msg : d.detail;
      throw new Error(msg || '登录失败');
    }
    if (!d.user.is_admin) {
      throw new Error('该密钥不是管理员密钥，无法进入后台');
    }
    TOKEN = d.token;
    localStorage.setItem(SKEY, TOKEN);
    ME = d.user;
    $('#lgKey').value = '';
    err.classList.add('hidden');
    await start();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    $('#lgBtn').disabled = false;
    $('#lgBtn').textContent = '登录';
  }
}

function logout() {
  TOKEN = ''; ME = null;
  localStorage.removeItem(SKEY);
  $('#app').classList.add('hidden');
  $('#loginPage').classList.remove('hidden');
  $('#lgKey').value = '';
}

$('#lgKey').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ---------------- 导航 ---------------- */
const PAGES = [
  {id:'dash',   name:'数据概览', group:'运营', icon:'M3 3h7v7H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 14h7v7H3z'},
  {id:'review', name:'待审核',   group:'营地管理', icon:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11', badge:true},
  {id:'spots',  name:'全部营地', group:'营地管理', icon:'M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1118 0z'},
  {id:'users',  name:'用户管理', group:'用户与财务', icon:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8M23 21v-2a4 4 0 00-3-3.87'},
  {id:'notify', name:'消息中心', group:'用户与财务', icon:'M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0'},
  {id:'orders', name:'订单记录', group:'用户与财务', icon:'M9 2h6v3H9zM4 5h16v16H4zM9 12h6M9 16h4'},
  {id:'admins', name:'管理员',   group:'系统', icon:'M12 2l2.6 5.6 6.2.8-4.5 4.3 1.1 6.1L12 16l-5.4 2.8 1.1-6.1L3.2 8.4l6.2-.8z'},
  {id:'logs',   name:'操作日志', group:'系统', icon:'M12 8v4l3 2M3 12a9 9 0 1018 0 9 9 0 00-18 0'},
  {id:'tiles',  name:'瓦片缓存', group:'系统', icon:'M3 12l6-3 6 3 6-3v9l-6 3-6-3-6 3zM9 9v9M15 9v9'},
];

let pendingCount = 0;

function renderNav() {
  const groups = {};
  PAGES.forEach(p => { (groups[p.group] = groups[p.group] || []).push(p); });
  $('#nav').innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="nav-t">${esc(g)}</div>
    ${items.map(p => `

}

const state = {page: 'dash'};

function go(page) {
  state.page = page;
  const p = PAGES.find(x => x.id === page);
  $('#pageTitle').textContent = p ? p.name : '管理后台';
  renderNav();
  ({dash:renderDash, review:renderReview, spots:renderSpots,
    users:renderUsers, orders:renderOrders, admins:renderAdmins,
    logs:renderLogs, notify:renderNotify, tiles:renderTiles}[page] || renderDash)();
}

function thumbCell(it) {

    return `<img class="thumb-sm" src="${esc(im.thumb || im.url)}" onclick="openLb('${esc(im.url)}')" alt="">`;
  }
  return `<div class="thumb-none">无图</div>`;
}

function doSpotSearch() { spotFilter.keyword = $('#spotKw').value.trim(); spotFilter.page = 1; renderSpots(); }
function gotoPage(p) { spotFilter.page = p; renderSpots(); }

async function setStatus(id, status) {
  const label = {1:'上线', 3:'下架'}[status] || '更新';
  if (!confirm(`确定要${label}这个营地吗？`)) return;
  try {
    await api(`/api/admin/spots/${id}`, {method:'PATCH', body: JSON.stringify({status})});
    toast(`已${label}`, 'ok');
    renderSpots();
  } catch (e) { toast(e.message, 'err'); }
}

async function saveSpot(id) {
  const body = {
    name: $('#e_name').value.trim(),
    spot_type: $('#e_type').value,
    price_range: $('#e_price').value.trim(),
    province: $('#e_prov').value.trim(),
    city: $('#e_city').value.trim(),
    address: $('#e_addr').value.trim(),
    phone: $('#e_phone').value.trim(),
    lng: parseFloat($('#e_lng').value),
    lat: parseFloat($('#e_lat').value),
    detail: $('#e_detail').value.trim(),
  };
  if (!body.name || isNaN(body.lng) || isNaN(body.lat)) return toast('名称和坐标不能为空', 'err');
  try {
    await api('/api/admin/spots/' + id, {method:'PATCH', body: JSON.stringify(body)});
    toast('已保存', 'ok');
    closeModal();
    go(state.page);
  } catch (e) { toast(e.message, 'err'); }
}

async function delSpot(id, name) {
  if (!confirm(`确定要永久删除「${name}」吗？\n\n这会同时删除它的所有评价，且不可恢复。\n如果只是想让它不显示，请用「下架」。`)) return;
  try {
    await api('/api/admin/spots/' + id, {method:'DELETE'});
    toast('已删除', 'ok');
    closeModal();
    go(state.page);
  } catch (e) { toast(e.message, 'err'); }
}

/* 后台编辑的 detail 现在存的是 {"字段":{"from":"旧值","to":"新值"}}，
   直接把 JSON 甩在页面上没人看得懂，这里渲染成"旧值 → 新值"。 */
function fmtAuditDetail(detail) {
  if (!detail) return '';
  let obj = null;
  try { obj = JSON.parse(detail); } catch (e) { obj = null; }
  if (!obj || typeof obj !== 'object') return esc(detail);
  return Object.entries(obj).map(([k, v]) => {
    const from = v && v.from !== undefined ? v.from : '';
    const to = v && v.to !== undefined ? v.to : '';
    const cut = x => {
      const s = typeof x === 'object' ? JSON.stringify(x) : String(x ?? '');
      return s.length > 60 ? s.slice(0, 60) + '…' : s;
    };
    return `<div style="margin-top:2px"><code style="color:var(--ink-2)">${esc(k)}</code>：${esc(cut(from))} <b style="color:var(--green-d)">→</b> ${esc(cut(to))}</div>`;
  }).join('');
}

async function purgeTiles() {
  if (!confirm('清理过期瓦片缓存？命中过的瓦片会重新回源一次。')) return;
  try {
    const r = await api('/api/admin/tile-cache/purge', {method: 'POST'});
    alert(`已删除 ${r.removed} 块，释放 ${r.freed_mb}MB，剩余 ${r.kept_mb}MB`);
    renderTiles();
  } catch (e) { alert(e.message); }
}

/* ---------------- 启动 ---------------- */
async function start() {
  $('#loginPage').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').innerHTML = `
    <div class="av">${esc((ME.nickname || 'A')[0])}</div>
    <div><div style="font-weight:500;color:var(--ink)">${esc(ME.nickname)}</div>
    <div style="font-size:11.5px;color:var(--ink-3)">管理员</div></div>
    <button class="btn btn-ghost btn-sm" onclick="logout()" style="margin-left:6px">退出</button>`;

  try {
    const meta = await api('/api/meta');
    SPOT_TYPES = meta.spot_types;
    FACILITY_KEYS = meta.facility_keys;
  } catch (e) {}

  const s = await api('/api/admin/stats').catch(() => null);
  if (s) pendingCount = s.spots_pending;
  // 支持 #review / #spots 等直达，方便分享具体页面链接
  const goto = (location.hash || '').replace('#', '')
             || localStorage.getItem('rv_admin_goto') || 'dash';
  localStorage.removeItem('rv_admin_goto');
  go(PAGES.some(p => p.id === goto) ? goto : 'dash');
}

(async function boot() {
  // 未登录时先把开发模式的演示密钥提示填进去（生产环境后端不返回，提示保持隐藏）
  try {
    const m = await api('/api/meta');
    if (m.demo_keys && m.demo_keys.admin_key) {
      const hint = document.getElementById('adminHint');
      if (hint) {
        hint.insertAdjacentHTML('afterbegin',
          `演示管理员密钥（点一下填入）：<br><code onclick="(()=>{const i=document.getElementById('lgKey'); if(i){i.value='${m.demo_keys.admin_key}'; i.focus();}})()"` +
          ` style="cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:2px 6px;border-radius:4px;border:1px solid #E3E1DC;display:inline-block;margin-top:5px;word-break:break-all">${m.demo_keys.admin_key}</code>`);
      }
    }
  } catch (e) {}
  if (!TOKEN) return;
  try {
    const d = await api('/api/auth/me');
    if (!d.user || !d.user.is_admin) { logout(); return; }
    ME = d.user;
    await start();
  } catch (e) {
    logout();
  }
})();
</script>
